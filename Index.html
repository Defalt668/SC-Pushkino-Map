                selectedItem = { type: 'object', id: state.objects[i].id };
                renderSidebar(); renderPropsPanel(); redraw();
                return;
            }
        }
    } else if (submode === 'cameras') {
        for (let i = state.cameras.length - 1; i >= 0; i--) {
            if (hitTestCamera(world, state.cameras[i])) {
                openCameraModal(state.cameras[i].id);
                return;
            }
        }
    }
}

canvas.addEventListener('click', (e) => {
    if (accessMode) return;
    const pos = getMousePos(e);
    for (let i = state.cameras.length - 1; i >= 0; i--) {
        const cam = state.cameras[i];
        if (hitTestCamera(pos.world, cam)) {
            if (cam.url && cam.url !== 'https://') window.open(cam.url, '_blank');
            return;
        }
    }
});

/* СОЗДАНИЕ */
function addGapToWall(wall, world) {
    const len = Math.hypot(wall.x2 - wall.x1, wall.y2 - wall.y1);
    if (len < 0.1) return;
    const ux = (wall.x2 - wall.x1) / len;
    const uy = (wall.y2 - wall.y1) / len;
    const dx = world.x - wall.x1;
    const dy = world.y - wall.y1;
    const proj = dx * ux + dy * uy;
    let t = proj / len;
    t = Math.max(0.01, Math.min(0.99, t));
    if (!wall.gaps) wall.gaps = [];
    const type = activeGapType;
    const def = GAP_TYPES[type];
    pushHistory();
    const gapId = 'gap_' + Date.now() + '_' + (state.counter.gap++);
    const gap = {
        id: gapId, t,
        width: def.defaultWidth,
        type,
        name: def.label + ' ' + state.counter.gap
    };
    if (type === 'gate') {
        gap.dock = { depth: 15, side: 1, name: '' };
    }
    wall.gaps.push(gap);
    selectedItem = { type: 'gap', id: gapId, objId: wall.id };
    saveState();
    renderSidebar(); renderPropsPanel(); redraw();
}

function createMark(pos) {
    pushHistory();
    const id = 'obj_' + Date.now() + '_' + (state.counter.obj++);
    const obj = {
        id, kind: 'mark',
        markType: activeMarkType,
        x: pos.x, y: pos.y,
        name: ''
    };
    state.objects.push(obj);
    selectedItem = { type: 'object', id };
    saveState();
    renderSidebar(); renderPropsPanel(); redraw();
}

/* ПАНЕЛЬ СВОЙСТВ */
function renderPropsPanel() {
    const panel = document.getElementById('props-panel');
    const body = document.getElementById('props-body');
    const title = document.getElementById('props-title');
    const typeBadge = document.getElementById('props-type');
    const deleteBtn = document.getElementById('props-delete-btn');

    const showForDrawing = accessMode && submode === 'layout' && activeTool !== 'select';
    const hasSelection = selectedItem && accessMode;

    if (!showForDrawing && !hasSelection) {
        panel.classList.remove('visible'); return;
    }
    panel.classList.add('visible');

    if (hasSelection) {
        if (selectedItem.type === 'object') {
            const obj = state.objects.find(o => o.id === selectedItem.id);
            if (!obj) { panel.classList.remove('visible'); return; }
            renderObjectProps(obj, body, title, typeBadge, deleteBtn);
        } else if (selectedItem.type === 'camera') {
            const cam = state.cameras.find(c => c.id === selectedItem.id);
            if (!cam) { panel.classList.remove('visible'); return; }
            renderCameraProps(cam, body, title, typeBadge, deleteBtn);
        } else if (selectedItem.type === 'gap') {
            const wall = state.objects.find(o => o.id === selectedItem.objId);
            const gap = wall && wall.gaps ? wall.gaps.find(g => g.id === selectedItem.id) : null;
            if (!gap) { panel.classList.remove('visible'); return; }
            renderGapProps(wall, gap, body, title, typeBadge, deleteBtn);
        }
    } else {
        title.innerText = 'Инструмент';
        typeBadge.style.display = 'inline-block';
        if (activeTool === 'rect') typeBadge.innerText = 'Зона';
        else if (activeTool === 'line') typeBadge.innerText = 'Стена';
        else if (activeTool === 'cap-wall') typeBadge.innerText = 'Капит.';
        else if (activeTool === 'gap') typeBadge.innerText = 'Проём';
        else if (activeTool === 'mark') typeBadge.innerText = 'Метка';

        if (activeTool === 'gap') {
            body.innerHTML = `
                <div class="prop-row">
                    <label>Тип проёма</label>
                    <div class="style-btns">
                        ${Object.entries(GAP_TYPES).map(([k, v]) => `
                            <div class="style-btn ${k === activeGapType ? 'active' : ''}"
                                 onclick="setGapType('${k}')">${v.label}</div>
                        `).join('')}
                    </div>
                </div>
                <div style="color:var(--text-muted); font-size:12px; line-height:1.5;">
                    Кликните по стене, чтобы вставить проём.
                </div>
            `;
        } else if (activeTool === 'mark') {
            body.innerHTML = `
                <div class="prop-row">
                    <label>Тип метки</label>
                    <div class="style-btns">
                        ${Object.entries(MARKS_INFO).map(([k, v]) => `
                            <div class="style-btn ${k === activeMarkType ? 'active' : ''}"
                                 onclick="setMarkType('${k}')">${v.label}</div>
                        `).join('')}
                    </div>
                </div>
                <div style="color:var(--text-muted); font-size:12px; line-height:1.5;">
                    Кликните на карту, чтобы разместить метку.
                </div>
            `;
        } else {
            body.innerHTML = `
                <div style="color:var(--text-muted); font-size:12px; line-height:1.5;">
                    Нарисуйте ${activeTool === 'rect' ? 'прямоугольник' : 'линию'} на canvas.
                </div>
            `;
        }
        deleteBtn.style.display = 'none';
    }
}

function setGapType(type) { activeGapType = type; renderPropsPanel(); }
function setMarkType(type) { activeMarkType = type; renderPropsPanel(); }

function renderObjectProps(obj, body, title, typeBadge, deleteBtn) {
    const isLine = obj.kind === 'line' || obj.kind === 'cap-wall';
    const isMark = obj.kind === 'mark';

    if (isLine) {
        title.innerText = 'Стена';
        typeBadge.style.display = 'inline-block';
        typeBadge.innerText = obj.kind === 'cap-wall' ? 'Капит.' : 'Стена';
    } else if (isMark) {
        title.innerText = 'Метка';
        typeBadge.style.display = 'inline-block';
        typeBadge.innerText = (MARKS_INFO[obj.markType]?.label || 'Метка').split(' ')[0];
    } else {
        title.innerText = 'Зона';
        typeBadge.style.display = 'inline-block';
        typeBadge.innerText = 'Зона';
    }

    let html = `
        <div class="prop-row">
            <label>Название</label>
            <input type="text" value="${escapeAttr(obj.name || '')}" oninput="updateProp('name', this.value)">
        </div>
    `;

    if (isMark) {
        html += `
            <div class="prop-row">
                <label>Тип метки</label>
                <div class="style-btns">
                    ${Object.entries(MARKS_INFO).map(([k, v]) => `
                        <div class="style-btn ${k === obj.markType ? 'active' : ''}"
                             onclick="updateProp('markType', '${k}')">${v.label}</div>
                    `).join('')}
                </div>
            </div>
        `;
    } else if (!isLine) {
        html += `
            <div class="prop-row">
                <label>Цвет заливки</label>
                <div class="color-grid">
                    ${PALETTE.map(c => `
                        <div class="color-swatch ${c === obj.color ? 'selected' : ''}"
                             style="background:${c};"
                             onclick="updateProp('color', '${c}')"></div>
                    `).join('')}
                </div>
            </div>
            <div class="prop-row">
                <label>Прозрачность</label>
                <input type="range" min="0.05" max="1" step="0.05" value="${obj.opacity}"
                       oninput="updateProp('opacity', parseFloat(this.value))">
                <div class="range-info"><span>Прозрачность</span><span>${Math.round(obj.opacity * 100)}%</span></div>
            </div>
            <div class="prop-row">
                <label>Цвет границы</label>
                <div class="color-grid">
                    ${PALETTE.map(c => `
                        <div class="color-swatch ${c === (obj.borderColor || '#000000') ? 'selected' : ''}"
                             style="background:${c};"
                             onclick="updateProp('borderColor', '${c}')"></div>
                    `).join('')}
                </div>
            </div>
            <div class="prop-row">
                <label>Стиль границы</label>
                <div class="style-btns">
                    ${BORDER_STYLES.map(s => `
                        <div class="style-btn ${s.value === obj.borderStyle ? 'active' : ''}"
                             onclick="updateProp('borderStyle', '${s.value}')">${s.label}</div>
                    `).join('')}
                </div>
            </div>
            <div class="prop-row">
                <label>Размер</label>
                <div style="font-size:12px; color:var(--text-muted);">
                    ${(obj.w / PX_PER_M).toFixed(1)} × ${(obj.h / PX_PER_M).toFixed(1)} м
                </div>
            </div>
        `;
    } else {
        const isCap = obj.kind === 'cap-wall';
        html += `
            <div class="prop-row">
                <label>${isCap ? 'Цвет заливки' : 'Цвет'}</label>
                <div class="color-grid">
                    ${PALETTE.map(c => `
                        <div class="color-swatch ${c === obj.color ? 'selected' : ''}"
                             style="background:${c};"
                             onclick="updateProp('color', '${c}')"></div>
                    `).join('')}
                </div>
                ${isCap ? '<div style="font-size:11px; color:var(--text-muted); margin-top:6px;">Границы всегда чёрные</div>' : ''}
            </div>
            <div class="prop-row">
                <label>Толщина</label>
                <input type="range" min="1" max="20" step="1" value="${obj.thickness || 2}"
                       oninput="updateProp('thickness', parseInt(this.value))">
                <div class="range-info"><span>${obj.thickness || 2} px</span><span>${((obj.thickness || 2) / PX_PER_M).toFixed(2)} м</span></div>
            </div>
            <div class="prop-row">
                <label>Стиль</label>
                <div class="style-btns">
                    <div class="style-btn ${obj.borderStyle === 'solid' ? 'active' : ''}"
                         onclick="updateProp('borderStyle', 'solid')">Сплошная</div>
                    <div class="style-btn ${obj.borderStyle === 'dashed' ? 'active' : ''}"
                         onclick="updateProp('borderStyle', 'dashed')">Пунктир</div>
                </div>
            </div>
            <div class="prop-row">
                <label>Размер</label>
                <div style="font-size:12px; color:var(--text-muted);">
                    Длина: ${(Math.hypot(obj.x2 - obj.x1, obj.y2 - obj.y1) / PX_PER_M).toFixed(1)} м
                </div>
            </div>
            <div class="prop-row">
                <label>Проёмы (${(obj.gaps || []).length})</label>
                <div class="gaps-list">
                    ${renderGapsListHTML(obj)}
                </div>
                <button class="btn btn-secondary btn-sm" onclick="addGapToSelectedWall()">+ Добавить проём</button>
            </div>
        `;
    }
    body.innerHTML = html;
    deleteBtn.style.display = '';
}

function renderGapsListHTML(wall) {
    const gaps = wall.gaps || [];
    if (gaps.length === 0) {
        return '<div style="color:var(--text-muted); font-size:11px; padding:4px 0;">Проёмов нет</div>';
    }
    return gaps.map(g => {
        const t = GAP_TYPES[g.type] || GAP_TYPES.pass;
        const isSel = selectedItem && selectedItem.type === 'gap' && selectedItem.id === g.id;
        return `
            <div class="gap-item ${isSel ? 'selected' : ''}"
                 onclick="selectGap('${wall.id}', '${g.id}')">
                <span class="gap-icon">${t.icon}</span>
                <div class="gap-info">
                    <div class="gap-name">${escapeHtml(g.name || t.label)}</div>
                    <div class="gap-sub">${g.width.toFixed(1)} м · ${t.label}</div>
                </div>
                <button class="btn-icon" title="Удалить" onclick="event.stopPropagation(); deleteGap('${wall.id}', '${g.id}')">✕</button>
            </div>
        `;
    }).join('');
}

function selectGap(wallId, gapId) {
    selectedItem = { type: 'gap', id: gapId, objId: wallId };
    renderPropsPanel();
    redraw();
}
function deleteGap(wallId, gapId) {
    const wall = state.objects.find(o => o.id === wallId);
    if (!wall || !wall.gaps) return;
    pushHistory();
    wall.gaps = wall.gaps.filter(g => g.id !== gapId);
    if (selectedItem && selectedItem.id === gapId) selectedItem = { type: 'object', id: wallId };
    saveState();
    renderSidebar(); renderPropsPanel(); redraw();
}
function addGapToSelectedWall() {
    if (!selectedItem || selectedItem.type !== 'object') return;
    const wall = state.objects.find(o => o.id === selectedItem.id);
    if (!wall || (wall.kind !== 'line' && wall.kind !== 'cap-wall')) return;
    const type = activeGapType;
    const def = GAP_TYPES[type];
    pushHistory();
    if (!wall.gaps) wall.gaps = [];
    const gapId = 'gap_' + Date.now() + '_' + (state.counter.gap++);
    const gap = {
        id: gapId, t: 0.5, width: def.defaultWidth, type,
        name: def.label + ' ' + state.counter.gap
    };
    if (type === 'gate') {
        gap.dock = { depth: 15, side: 1, name: '' };
    }
    wall.gaps.push(gap);
    selectedItem = { type: 'gap', id: gapId, objId: wall.id };
    saveState();
    renderSidebar(); renderPropsPanel(); redraw();
}

function renderGapProps(wall, gap, body, title, typeBadge, deleteBtn) {
    title.innerText = 'Проём';
    typeBadge.style.display = 'inline-block';
    typeBadge.innerText = GAP_TYPES[gap.type]?.label || 'Проём';

    body.innerHTML = `
        <div class="prop-row">
            <label>Название</label>
            <input type="text" value="${escapeAttr(gap.name || '')}" oninput="updateGapProp('name', this.value)">
        </div>
        <div class="prop-row">
            <label>Тип</label>
            <div class="style-btns">
                ${Object.entries(GAP_TYPES).map(([k, v]) => `
                    <div class="style-btn ${k === gap.type ? 'active' : ''}"
                         onclick="updateGapProp('type', '${k}')">${v.label}</div>
                `).join('')}
            </div>
        </div>
        <div class="prop-row">
            <label>Ширина</label>
            <input type="range" min="0.3" max="15" step="0.1" value="${gap.width}"
                   oninput="updateGapProp('width', parseFloat(this.value))">
            <div class="range-info"><span>${gap.width.toFixed(1)} м</span><span>${(gap.width * PX_PER_M).toFixed(0)} px</span></div>
        </div>
        <div class="prop-row">
            <label>Позиция на стене</label>
            <input type="range" min="1" max="99" step="1" value="${Math.round(gap.t * 100)}"
                   oninput="updateGapProp('t', parseInt(this.value) / 100)">
            <div class="range-info"><span>${Math.round(gap.t * 100)}%</span></div>
        </div>
        ${gap.type === 'gate' ? `
            <div class="prop-row">
                <label>Причал (док)</label>
                <div style="font-size:12px; color:var(--text-muted); margin-bottom:6px;">
                    Внешняя площадка у ворот.
                </div>
                <label style="margin-top:8px;">Название дока</label>
                <input type="text" value="${escapeAttr(gap.dock?.name || '')}"
                       oninput="updateGapProp('dock.name', this.value)"
                       placeholder="Оставьте пустым, если не нужно">
                <label style="margin-top:8px;">Глубина</label>
                <input type="range" min="5" max="40" step="1" value="${gap.dock?.depth || 15}"
                       oninput="updateGapProp('dock.depth', parseInt(this.value))">
                <div class="range-info"><span>${gap.dock?.depth || 15} м</span></div>
                <label style="margin-top:8px;">Сторона</label>
                <div class="style-btns">
                    <div class="style-btn ${(gap.dock?.side || 1) === 1 ? 'active' : ''}"
                         onclick="updateGapProp('dock.side', 1)">A</div>
                    <div class="style-btn ${(gap.dock?.side || 1) === -1 ? 'active' : ''}"
                         onclick="updateGapProp('dock.side', -1)">B</div>
                </div>
            </div>
        ` : ''}
    `;
    deleteBtn.style.display = '';
}

function updateGapProp(key, value) {
    if (!selectedItem || selectedItem.type !== 'gap') return;
    const wall = state.objects.find(o => o.id === selectedItem.objId);
    if (!wall) return;
    const gap = wall.gaps.find(g => g.id === selectedItem.id);
    if (!gap) return;
    pushHistory();
    if (key.includes('.')) {
        const [k1, k2] = key.split('.');
        if (!gap[k1]) gap[k1] = {};
        gap[k1][k2] = value;
    } else {
        gap[key] = value;
    }
    saveState();
    renderSidebar(); redraw();
    if (key === 'type') renderPropsPanel();
    if (key === 'width') {
        const info = document.querySelectorAll('.prop-row .range-info')[0];
        if (info) {
            const spans = info.querySelectorAll('span');
            if (spans[0]) spans[0].innerText = value.toFixed(1) + ' м';
            if (spans[1]) spans[1].innerText = (value * PX_PER_M).toFixed(0) + ' px';
        }
    }
    if (key === 't') {
        const infos = document.querySelectorAll('.prop-row .range-info');
        if (infos[1]) {
            const spans = infos[1].querySelectorAll('span');
            if (spans[0]) spans[0].innerText = Math.round(value * 100) + '%';
        }
    }
}

function renderCameraProps(cam, body, title, typeBadge, deleteBtn) {
    title.innerText = 'Камера';
    typeBadge.style.display = 'inline-block';
    typeBadge.innerText = 'CAM';
    const folderOptions = `
        <option value="">— Без папки —</option>
        ${state.folders.map(f => `
            <option value="${f.id}" ${f.id === cam.folderId ? 'selected' : ''}>${escapeHtml(f.name)}</option>
        `).join('')}
    `;
    body.innerHTML = `
        <div class="prop-row">
            <label>Название</label>
            <input type="text" value="${escapeAttr(cam.name)}" oninput="updateProp('name', this.value)">
        </div>
        <div class="prop-row">
            <label>URL потока</label>
            <input type="text" value="${escapeAttr(cam.url)}" oninput="updateProp('url', this.value)">
        </div>
        <div class="prop-row">
            <label>Папка</label>
            <select onchange="updateProp('folderId', this.value || null)"
                    style="width:100%; padding:8px 10px; background:var(--bg-main); border:1px solid var(--border-color); border-radius:6px; color:var(--text-main); font-size:13px; font-family:inherit; outline:none;">
                ${folderOptions}
            </select>
        </div>
        <div class="prop-row">
            <label>Параметры обзора</label>
            <div style="font-size:12px; color:var(--text-muted); line-height:1.7;">
                Угол: ${cam.angle}°<br>
                Сектор: ${cam.fov}°<br>
                Дальность: ${(cam.length / PX_PER_M).toFixed(1)} м
            </div>
        </div>
    `;
    deleteBtn.style.display = '';
}

function updateProp(key, value) {
    if (!selectedItem || !accessMode) return;
    if (selectedItem.type !== 'object' && selectedItem.type !== 'camera') return;
    pushHistory();
    if (selectedItem.type === 'object') {
        const obj = state.objects.find(o => o.id === selectedItem.id);
        if (!obj) return;
        obj[key] = value;
    } else if (selectedItem.type === 'camera') {
        const cam = state.cameras.find(c => c.id === selectedItem.id);
        if (!cam) return;
        cam[key] = value;
    }
    saveState();
    renderSidebar();
    redraw();

    if (key === 'opacity') {
        const info = document.querySelector('.prop-row .range-info');
        if (info) {
            const spans = info.querySelectorAll('span');
            if (spans[1]) spans[1].innerText = Math.round(value * 100) + '%';
        }
    }
    if (key === 'thickness') {
        const info = document.querySelector('.prop-row .range-info');
        if (info) {
            const spans = info.querySelectorAll('span');
            if (spans[0]) spans[0].innerText = value + ' px';
            if (spans[1]) spans[1].innerText = (value / PX_PER_M).toFixed(2) + ' м';
        }
    }

    if (['color','borderColor','borderStyle','markType','folderId'].includes(key)) {
        renderPropsPanel();
    }
}

function deleteSelected() {
    if (!selectedItem) return;
    if (!confirm('Удалить этот элемент?')) return;
    pushHistory();
    if (selectedItem.type === 'object') {
        state.objects = state.objects.filter(o => o.id !== selectedItem.id);
    } else if (selectedItem.type === 'camera') {
        state.cameras = state.cameras.filter(c => c.id !== selectedItem.id);
    } else if (selectedItem.type === 'gap') {
        const wall = state.objects.find(o => o.id === selectedItem.objId);
        if (wall && wall.gaps) {
            wall.gaps = wall.gaps.filter(g => g.id !== selectedItem.id);
        }
    }
    selectedItem = null;
    saveState();
    renderSidebar(); renderPropsPanel(); redraw();
}

/* МОДАЛКА */
function openCameraModal(id, coords) {
    editingType = 'camera';
    editingId = id;
    const title = document.getElementById('modal-title');
    const body = document.getElementById('modal-body');
    const deleteBtn = document.getElementById('modal-delete-btn');
    let cam;
    if (id) {
        cam = state.cameras.find(c => c.id === id);
        title.innerText = 'Редактирование камеры';
        deleteBtn.style.display = '';
    } else {
        cam = { name: 'Камера ' + state.counter.cam, url: 'https://', folderId: null };
        title.innerText = 'Новая камера';
        deleteBtn.style.display = 'none';
    }
    const folderOptions = `
        <option value="">— Без папки —</option>
        ${state.folders.map(f => `
            <option value="${f.id}" ${f.id === cam.folderId ? 'selected' : ''}>${escapeHtml(f.name)}</option>
        `).join('')}
    `;
    body.innerHTML = `
        <div class="form-row">
            <label>Название</label>
            <input type="text" id="m-cam-name" value="${escapeAttr(cam.name)}">
        </div>
        <div class="form-row">
            <label>URL потока</label>
            <input type="text" id="m-cam-url" value="${escapeAttr(cam.url)}">
        </div>
        <div class="form-row">
            <label>Папка</label>
            <select id="m-cam-folder">${folderOptions}</select>
        </div>
    `;

    setTimeout(() => document.getElementById('m-cam-name')?.focus(), 50);
}
function saveModal() {
    if (editingType !== 'camera') { closeModal(); return; }
    const name = document.getElementById('m-cam-name').value.trim();
    const url = document.getElementById('m-cam-url').value.trim();
    const folderId = document.getElementById('m-cam-folder').value || null;
    if (!url || url === 'https://') { alert('Укажите корректный URL'); return; }
    pushHistory();
    if (editingId) {
        const cam = state.cameras.find(c => c.id === editingId);
        cam.name = name; cam.url = url; cam.folderId = folderId;
    } else {
        const newId = 'cam_' + Date.now() + '_' + (state.counter.cam++);
        state.cameras.push({
            id: newId, x: tempCoords.x, y: tempCoords.y,
            angle: 0, fov: 45, length: 20,
            name, url, folderId
        });
        selectedItem = { type: 'camera', id: newId };
    }
    saveState();
    closeModal();
    renderSidebar(); renderPropsPanel(); redraw();
}
function deleteFromModal() {
    if (!editingId) return;
    if (!confirm('Удалить камеру?')) return;
    pushHistory();
    state.cameras = state.cameras.filter(c => c.id !== editingId);
    if (selectedItem && selectedItem.id === editingId) selectedItem = null;
    saveState();
    closeModal();
    renderSidebar(); renderPropsPanel(); redraw();
}
function openModal() {
    document.getElementById('modal').classList.add('visible');
    document.getElementById('modal-overlay').classList.add('visible');
}
function closeModal() {
    document.getElementById('modal').classList.remove('visible');
    document.getElementById('modal-overlay').classList.remove('visible');
}

/* САЙДБАР */
function renderSidebar() {
    const container = document.getElementById('sb-content');
    container.innerHTML = '';
    if (!accessMode) renderViewMode(container);
    else {
        if (submode === 'layout') renderLayoutList(container);
        else renderCamerasList(container);
    }
}

function renderViewMode(container) {
    const q = searchQuery.toLowerCase();
    const matches = (cam) => !q || cam.name.toLowerCase().includes(q);
    const rootCameras = state.cameras.filter(c => !c.folderId && matches(c)).sort((a, b) => a.name.localeCompare(b.name));
    const folders = [...state.folders].sort((a, b) => a.name.localeCompare(b.name));
    if (rootCameras.length === 0 && folders.length === 0) {
        container.innerHTML = '<div class="sb-empty">Камеры ещё не добавлены</div>';
        return;
    }
    rootCameras.forEach(cam => container.appendChild(makeViewCameraItem(cam)));
    folders.forEach(folder => {
        const cams = state.cameras.filter(c => c.folderId === folder.id && matches(c)).sort((a, b) => a.name.localeCompare(b.name));
        if (q && cams.length === 0) return;
        container.appendChild(makeViewFolder(folder, cams));
    });
}
function makeViewCameraItem(cam) {
    const el = document.createElement('div');
    el.className = 'list-item';
    el.innerHTML = `
        <div class="list-item-icon">📹</div>
        <div class="list-item-info">
            <div class="list-item-title">${escapeHtml(cam.name)}</div>
            <div class="list-item-sub">${escapeHtml(cam.url)}</div>
        </div>
    `;
    el.onclick = () => { if (cam.url && cam.url !== 'https://') window.open(cam.url, '_blank'); };
    return el;
}
function makeViewFolder(folder, cams) {
    const wrap = document.createElement('div');
    const isCollapsed = collapsedFolders[folder.id];
    const header = document.createElement('div');
    header.className = 'folder-header' + (isCollapsed ? ' collapsed' : '');
    header.innerHTML = `
        <span class="arrow">▼</span>
        <span style="font-size:14px;">📁</span>
        <span class="folder-name">${escapeHtml(folder.name)}</span>
        <span class="folder-count">${cams.length}</span>
    `;
    header.onclick = () => { collapsedFolders[folder.id] = !collapsedFolders[folder.id]; renderSidebar(); };
    wrap.appendChild(header);
    const children = document.createElement('div');
    children.className = 'folder-children' + (isCollapsed ? ' collapsed' : '');
    cams.forEach(cam => children.appendChild(makeViewCameraItem(cam)));
    wrap.appendChild(children);
    return wrap;
}

function renderLayoutList(container) {
    const q = searchQuery.toLowerCase();
    const items = state.objects
        .filter(o => !q || (o.name || '').toLowerCase().includes(q))
        .sort((a, b) => (a.name || '').localeCompare(b.name || ''));
    if (items.length === 0) {
        container.innerHTML = '<div class="sb-empty">Объектов нет.<br>Нарисуйте зону, стену<br>или разместите метку.</div>';
        return;
    }
    items.forEach(obj => {
        const el = document.createElement('div');
        el.className = 'list-item';
        if (selectedItem && selectedItem.type === 'object' && selectedItem.id === obj.id) el.classList.add('selected');
        let sub = '', icon = '', swatch = '';
        if (obj.kind === 'line' || obj.kind === 'cap-wall') {
            const len = Math.hypot(obj.x2 - obj.x1, obj.y2 - obj.y1) / PX_PER_M;
            const gapCount = (obj.gaps || []).length;
            sub = `${len.toFixed(1)} м` + (gapCount > 0 ? ` · ${gapCount} проёмов` : '');
            icon = obj.kind === 'cap-wall' ? '▬' : '╱';
        } else if (obj.kind === 'mark') {
            const info = MARKS_INFO[obj.markType] || MARKS_INFO.shield;
            sub = info.label;
            swatch = `<div class="list-item-swatch" style="background:${info.bg};"></div>`;
        } else {
            sub = `${(obj.w / PX_PER_M).toFixed(1)} × ${(obj.h / PX_PER_M).toFixed(1)} м`;
            swatch = `<div class="list-item-swatch" style="background:${obj.color}; opacity:${Math.max(0.4, obj.opacity)};"></div>`;
        }
        el.innerHTML = `
            ${swatch || `<div class="list-item-icon">${icon}</div>`}
            <div class="list-item-info">
                <div class="list-item-title">${escapeHtml(obj.name || 'Без названия')}</div>
                <div class="list-item-sub">${sub}</div>
            </div>
        `;
        el.onclick = () => {
            selectedItem = { type: 'object', id: obj.id };
            renderSidebar(); renderPropsPanel(); redraw();
        };
        container.appendChild(el);
    });
}

function renderCamerasList(container) {
    const q = searchQuery.toLowerCase();
    const matches = (cam) => !q || cam.name.toLowerCase().includes(q);
    const createBtn = document.createElement('button');
    createBtn.className = 'btn btn-secondary btn-sm';
    createBtn.innerText = '+ Создать папку';
    createBtn.style.marginBottom = '8px';
    createBtn.onclick = createFolder;
    container.appendChild(createBtn);
    const rootCameras = state.cameras.filter(c => !c.folderId && matches(c)).sort((a, b) => a.name.localeCompare(b.name));
    const folders = [...state.folders].sort((a, b) => a.name.localeCompare(b.name));
    if (rootCameras.length === 0 && folders.length === 0 && !q) {
        const empty = document.createElement('div');
        empty.className = 'sb-empty';
        empty.innerHTML = 'Камер нет.<br>Кликните на canvas, чтобы добавить.';
        container.appendChild(empty);
        return;
    }
    if (rootCameras.length > 0) {
        const t = document.createElement('div');
        t.className = 'sb-section-title';
        t.innerText = 'Без папки';
        container.appendChild(t);
    }
    rootCameras.forEach(cam => container.appendChild(makeEditCameraItem(cam)));
    folders.forEach(folder => {
        const cams = state.cameras.filter(c => c.folderId === folder.id && matches(c)).sort((a, b) => a.name.localeCompare(b.name));
        if (q && cams.length === 0) return;
        container.appendChild(makeEditFolder(folder, cams));
    });
}
function makeEditCameraItem(cam) {
    const el = document.createElement('div');
    el.className = 'list-item';
    if (selectedItem && selectedItem.type === 'camera' && selectedItem.id === cam.id) el.classList.add('selected');
    el.draggable = true;
    el.dataset.cameraId = cam.id;
    el.innerHTML = `
        <div class="list-item-icon">📹</div>
        <div class="list-item-info">
            <div class="list-item-title">${escapeHtml(cam.name)}</div>
            <div class="list-item-sub">${escapeHtml(cam.url)}</div>
        </div>
    `;
    el.onclick = () => {
        selectedItem = { type: 'camera', id: cam.id };
        renderSidebar(); renderPropsPanel(); redraw();
    };
    el.ondblclick = () => openCameraModal(cam.id);
    el.addEventListener('dragstart', (e) => {
        draggingCameraId = cam.id;
        el.classList.add('dragging');
        e.dataTransfer.effectAllowed = 'move';
    });
    el.addEventListener('dragend', () => {
        draggingCameraId = null;
        el.classList.remove('dragging');
        document.querySelectorAll('.folder-header').forEach(h => h.classList.remove('drag-over'));
    });
    return el;
}
function makeEditFolder(folder, cams) {
    const wrap = document.createElement('div');
    const isCollapsed = collapsedFolders[folder.id];
    const header = document.createElement('div');
    header.className = 'folder-header' + (isCollapsed ? ' collapsed' : '');
    header.dataset.folderId = folder.id;
    header.innerHTML = `
        <span class="arrow">▼</span>
        <span style="font-size:14px;">📁</span>
        <span class="folder-name">${escapeHtml(folder.name)}</span>
        <span class="folder-count">${cams.length}</span>
        <span class="folder-actions">
            <button class="btn-icon" title="Переименовать" data-act="rename">✏️</button>
            <button class="btn-icon" title="Удалить" data-act="delete">✕</button>
        </span>
    `;
    header.onclick = (e) => {
        const act = e.target.dataset?.act;
        if (act === 'rename') { e.stopPropagation(); renameFolder(folder.id); return; }
        if (act === 'delete') { e.stopPropagation(); deleteFolder(folder.id); return; }
        collapsedFolders[folder.id] = !collapsedFolders[folder.id];
        renderSidebar();
    };
    header.ondblclick = (e) => { e.stopPropagation(); renameFolder(folder.id); };
    header.addEventListener('dragover', (e) => {
        e.preventDefault(); e.dataTransfer.dropEffect = 'move';
        header.classList.add('drag-over');
    });
    header.addEventListener('dragleave', () => header.classList.remove('drag-over'));
    header.addEventListener('drop', (e) => {
        e.preventDefault();
        header.classList.remove('drag-over');
        if (!draggingCameraId) return;
        const cam = state.cameras.find(c => c.id === draggingCameraId);
        if (!cam || cam.folderId === folder.id) return;
        pushHistory();
        cam.folderId = folder.id;
        collapsedFolders[folder.id] = false;
        saveState();
        renderSidebar();
    });
    wrap.appendChild(header);
    const children = document.createElement('div');
    children.className = 'folder-children' + (isCollapsed ? ' collapsed' : '');
    children.dataset.folderId = folder.id;
    children.addEventListener('dragover', (e) => { e.preventDefault(); e.dataTransfer.dropEffect = 'move'; });
    children.addEventListener('drop', (e) => {
        e.preventDefault();
        if (!draggingCameraId) return;
        const cam = state.cameras.find(c => c.id === draggingCameraId);
        if (!cam || cam.folderId === folder.id) return;
        pushHistory();
        cam.folderId = folder.id;
        saveState();
        renderSidebar();
    });
    cams.forEach(cam => children.appendChild(makeEditCameraItem(cam)));
    wrap.appendChild(children);
    return wrap;
}
function createFolder() {
    const name = prompt('Название папки:', 'Новая папка');
    if (!name || !name.trim()) return;
    pushHistory();
    state.folders.push({
        id: 'folder_' + Date.now() + '_' + (state.counter.folder++),
        name: name.trim()
    });
    saveState();
    renderSidebar();
}
function renameFolder(id) {
    const f = state.folders.find(x => x.id === id);
    if (!f) return;
    const name = prompt('Новое название:', f.name);
    if (!name || !name.trim()) return;
    pushHistory();
    f.name = name.trim();
    saveState();
    renderSidebar();
}
function deleteFolder(id) {
    const f = state.folders.find(x => x.id === id);
    if (!f) return;
    const count = state.cameras.filter(c => c.folderId === id).length;
    const msg = count > 0
        ? `Удалить папку "${f.name}"? ${count} камер(ы) вернутся в корень.`
        : `Удалить папку "${f.name}"?`;
    if (!confirm(msg)) return;
    pushHistory();
    state.cameras.forEach(c => { if (c.folderId === id) c.folderId = null; });
    state.folders = state.folders.filter(x => x.id !== id);
    saveState();
    renderSidebar();
}
function onSearchInput() {
    searchQuery = document.getElementById('search-input').value.trim();
    renderSidebar();
}

/* ЭКСПОРТ / ИМПОРТ */
function exportJSON() {
    const data = JSON.stringify(state, null, 2);
    const blob = new Blob([data], { type: 'application/json' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = 'sc-map-' + new Date().toISOString().slice(0, 10) + '.json';
    a.click();
    URL.revokeObjectURL(url);
}
function importJSON(event) {
    const file = event.target.files[0];
    if (!file) return;
    const reader = new FileReader();
    reader.onload = (e) => {
        try {
            const p = JSON.parse(e.target.result);
            if (!p.objects || !p.cameras) throw new Error('Неверный формат');
            if (!confirm('Текущая конфигурация будет заменена. Продолжить?')) return;
            pushHistory();
            state = {
                objects: p.objects || [],
                cameras: p.cameras || [],
                folders: p.folders || [],
                settings: { ...DEFAULT_SETTINGS, ...(p.settings || {}) },
                counter: p.counter || { obj: 1, cam: 1, folder: 1, gap: 1, mark: 1 }
            };
            saveState();
            selectedItem = null;
            syncSettingsUI();
            renderSidebar(); renderPropsPanel(); redraw();
            alert('Импорт завершён');
        } catch (err) { alert('Ошибка импорта: ' + err.message); }
    };
    reader.readAsText(file);
    event.target.value = '';
}
function resetAll() {
    if (!confirm('Полностью сбросить всю конфигурацию?')) return;
    if (!confirm('Точно уверены? Все объекты и камеры будут удалены.')) return;
    pushHistory();
    state = {
        objects: [], cameras: [], folders: [],
        settings: { ...DEFAULT_SETTINGS },
        counter: { obj: 1, cam: 1, folder: 1, gap: 1, mark: 1 }
    };
    saveState();
    selectedItem = null;
    syncSettingsUI();
    renderSidebar(); renderPropsPanel(); redraw();
}

/* УТИЛИТЫ */
function hexToRgba(hex, alpha) {
    if (!hex) return 'rgba(0,0,0,0)';
    const r = parseInt(hex.slice(1, 3), 16);
    const g = parseInt(hex.slice(3, 5), 16);
    const b = parseInt(hex.slice(5, 7), 16);
    return `rgba(${r},${g},${b},${alpha})`;
}
function getContrastColor(hex) {
    if (!hex || hex === '#fff' || hex === '#ffffff') return '#1a1a1a';
    if (hex.length < 7) return '#1a1a1a';
    const r = parseInt(hex.slice(1, 3), 16);
    const g = parseInt(hex.slice(3, 5), 16);
    const b = parseInt(hex.slice(5, 7), 16);
    const yiq = (r * 299 + g * 587 + b * 114) / 1000;
    return yiq >= 160 ? '#1a1a1a' : '#ffffff';
}
function wrapText(text, cx, cy, maxWidth, lineHeight) {
    const words = text.split(' ');
    const lines = [];
    let current = '';
    for (const w of words) {
        const test = current ? current + ' ' + w : w;
        if (ctx.measureText(test).width > maxWidth && current) {
            lines.push(current); current = w;
        } else current = test;
    }
    if (current) lines.push(current);
    const total = lines.length * lineHeight;
    const start = cy - total / 2 + lineHeight / 2;
    lines.forEach((line, i) => ctx.fillText(line, cx, start + i * lineHeight));
}
function escapeHtml(str) {
    if (str == null) return '';
    return String(str)
        .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;').replace(/'/g, '&#39;');
}
function escapeAttr(str) { return escapeHtml(str); }

/* ИНИЦИАЛИЗАЦИЯ */
function init() {
    initTheme();
    loadState();
    resizeCanvas();
    view.offsetX = (canvas.width - CANVAS_W) / 2;
    view.offsetY = (canvas.height - CANVAS_H) / 2;
    updateZoomIndicator();
    updateAccessUI();
    syncSettingsUI();
    renderSidebar();
    renderPropsPanel();
    redraw();
    updateHistoryButtons();
}
init();
